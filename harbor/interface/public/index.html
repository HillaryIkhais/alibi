<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REACH — Payment Gate Verified</title>
<style>
  /* NE BRUTALISTIC UI - raw, aggressive, uncompromising */
  :root {
    --void: #0a0a0a;
    --crack: #1a1a1a;
    --blood: #b30000;
    --bone: #e8e8e8;
    --copper: #b87333;
    --acid: #3fff00;
    --error: #ff1a1a;
    --warn: #ff5c00;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { 
    height: 100vh; 
    background: var(--void); 
    color: var(--bone);
    font-family: 'Courier New', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
    overflow: hidden;
  }
  
  /* NEON BLOOD ACCENTS */
  h1, h2, h3, h4, h5, h6 { 
    color: var(--blood); 
    text-shadow: 0 0 10px var(--blood), 0 0 20px var(--blood);
    letter-spacing: 1px;
  }
  
  /* STATIC NOISE EFFECT */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background: 
      radial-gradient(circle at 20% 30%, rgba(179,0,0,0.03) 0%, transparent 20%),
      radial-gradient(circle at 80% 70%, rgba(179,0,0,0.03) 0%, transparent 20%);
    pointer-events: none;
    z-index: 0;
  }
  
  /* RAW TECHNO INTERFACE */
  .terminal {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    padding: 24px;
  }
  
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 0;
    border-bottom: 2px solid var(--blood);
    margin-bottom: 24px;
  }
  
  .brand {
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 3px;
  }
  .brand span { color: var(--acid); }
  
  .status {
    display: flex;
    align-items: center;
    gap: 12px;
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 2px;
  }
  
  .dot {
    width: 12px;
    height: 12px;
    background: var(--blood);
    border: 2px solid var(--acid);
    border-radius: 50%;
    animation: pulse 1.5s infinite;
    box-shadow: 0 0 15px var(--blood);
  }
  
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.7; transform: scale(1.2); }
  }
  
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 24px;
  }
  
  .panel {
    background: var(--crack);
    border: 1px solid var(--blood);
    border-left: 4px solid var(--blood);
    border-radius: 0 8px 8px 0;
    padding: 20px;
    transition: all 0.3s;
  }
  
  .panel:hover {
    box-shadow: 0 0 30px rgba(179,0,0,0.3);
    transform: translateX(4px);
  }
  
  .panel h2 {
    font-size: 14px;
    margin-bottom: 16px;
    text-transform: uppercase;
    letter-spacing: 2px;
    border-bottom: 1px solid var(--blood);
    padding-bottom: 8px;
  }
  
  .metric {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 12px 0;
    border-bottom: 1px solid rgba(179,0,0,0.2);
  }
  
  .metric:last-child { border-bottom: none; }
  
  .metric-label {
    font-size: 11px;
    color: var(--bone);
    opacity: 0.7;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  
  .metric-value {
    font-size: 20px;
    font-weight: bold;
    color: var(--copper);
    font-family: 'Courier New', monospace;
  }
  
  .metric-value.danger { color: var(--blood); }
  .metric-value.safe { color: var(--acid); }
  .metric-value.warn { color: var(--warn); }
  
  /* CHANNEL MATRIX */
  .matrix {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 16px;
  }
  
  .channel {
    display: grid;
    grid-template-columns: 1fr 2fr 1fr;
    align-items: center;
    gap: 12px;
    padding: 16px;
    background: var(--crack);
    border: 1px solid var(--blood);
    border-left: 4px solid var(--blood);
    font-family: monospace;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }
  
  .channel:hover {
    background: rgba(179,0,0,0.2);
    box-shadow: 0 0 20px rgba(179,0,0,0.4);
  }
  
  .channel.dead {
    border-left: 6px solid var(--error);
  }
  
  .channel.live {
    border-left: 6px solid var(--acid);
  }
  
  .channel.fail {
    border-left: 6px solid var(--warn);
  }
  
  .chan-id {
    font-family: monospace;
    color: var(--bone);
    letter-spacing: 1px;
  }
  
  .chan-info {
    color: var(--bone);
  }
  
  .chan-info div {
    margin: 2px 0;
  }
  
  .chan-capacity {
    font-size: 14px;
    font-weight: bold;
    color: var(--copper);
    text-align: right;
  }
  
  .chan-status {
    text-align: right;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  
  .chan-status.live { color: var(--acid); }
  .chan-status.dead { color: var(--error); }
  .chan-status.fail { color: var(--warn); }
  
  /* PAYMENT FLOW - RAW */
  .flow {
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin-top: 24px;
  }
  
  .step {
    display: grid;
    grid-template-columns: 60px 1fr;
    gap: 16px;
    padding: 16px;
    border: 1px solid var(--blood);
    border-left: 6px solid var(--blood);
    background: var(--crack);
  }
  
  .step-number {
    font-size: 24px;
    font-weight: bold;
    color: var(--blood);
    font-family: monospace;
    line-height: 1;
  }
  
  .step-content {
    font-family: monospace;
    font-size: 12px;
  }
  
  .step-content pre {
    background: #000;
    border: 1px solid var(--blood);
    padding: 12px;
    border-radius: 4px;
    margin-top: 8px;
    overflow: auto;
  }
  
  .step.fail pre { background: rgba(255,26,26,0.2); }
  .step.pass pre { background: rgba(0,110,0,0.2); }
  
  .evidence {
    margin-top: 24px;
    padding: 16px;
    background: var(--crack);
    border: 2px solid var(--copper);
    border-left: 6px solid var(--copper);
  }
  
  .evidence h3 {
    color: var(--copper);
    margin-bottom: 12px;
    font-size: 14px;
  }
  
  .evidence pre {
    background: #000;
    border: 1px solid var(--blood);
    padding: 12px;
    border-radius: 4px;
    font-size: 11px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-all;
  }
  
  /* RAW BUTTONS */
  .actions {
    display: flex;
    gap: 12px;
    margin-top: 24px;
  }
  
  button {
    appearance: none;
    border: 2px solid var(--blood);
    background: var(--crack);
    color: var(--bone);
    padding: 12px 24px;
    font-family: monospace;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  
  button:hover {
    background: var(--blood);
    color: #fff;
    box-shadow: 0 0 20px var(--blood);
  }
  
  button:active {
    transform: scale(0.98);
  }
  
  button.dead {
    border-color: var(--error);
  }
  
  button.dead:hover {
    background: var(--error);
    box-shadow: 0 0 20px var(--error);
  }
  
  button.kill {
    border-color: var(--blood);
    background: var(--blood);
    color: #fff;
  }
  
  button.kill:hover {
    background: #fff;
    color: var(--void);
    box-shadow: 0 0 30px var(--blood);
  }
  
  /* FATAL ERROR DISPLAY */
  .fatal {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--error);
    color: #fff;
    padding: 12px;
    font-family: monospace;
    font-size: 12px;
    text-align: center;
    z-index: 100;
    border-top: 3px solid var(--blood);
  }
  
  /* GRAYSCALE MODE */
  .grayscale {
    filter: grayscale(100%);
  }
  
  .grayscale .panel,
  .grayscale .channel,
  .grayscale .step {
    filter: grayscale(100%);
  }
</style>
</head>
<body>

<div class="terminal">
  <header class="header">
    <div class="brand">REACH<span> — Payment Gate Verified</span></div>
    <div class="status">
      <span class="dot"></span>
      <span>LIVE</span>
    </div>
  </header>
  
  <div class="grid">
    <div class="panel">
      <h2>INVOICE STATUS</h2>
      <div class="metric">
        <span class="metric-label">Invoice ID</span>
        <span class="metric-value" id="inv-id">lnbcrt1m1p40t6y...</span>
      </div>
      <div class="metric">
        <span class="metric-label">Amount</span>
        <span class="metric-value" id="inv-amount">100,000 sats</span>
      </div>
      <div class="metric">
        <span class="metric-label">Status</span>
        <span class="metric-value" id="inv-status" style="color: var(--error);">UNPAIED</span>
      </div>
      <div class="metric">
        <span class="metric-label">Created</span>
        <span class="metric-value" id="inv-time" style="color: var(--bone);">14:32:01</span>
      </div>
    </div>
    
    <div class="panel">
      <h2>LIQUIDITY GATES</h2>
      <div class="metric">
        <span class="metric-label">Total Channels</span>
        <span class="metric-value" id="chan-total">3</span>
      </div>
      <div class="metric">
        <span class="metric-label">Outbound Capacity</span>
        <span class="metric-value" id="capacity-out">2.5M sats</span>
      </div>
      <div class="metric">
        <span class="metric-label">Inbound Capacity</span>
        <span class="metric-value" id="capacity-in" style="color: var(--acid);">500K sats</span>
      </div>
      <div class="metric">
        <span class="metric-label">Available Routes</span>
        <span class="metric-value" id="routes-live" style="color: var(--acid);">1</span>
      </div>
    </div>
  </div>
  
  <div class="panel" style="margin-top: 16px;">
    <h2>CHANNEL MATRIX</h2>
    <div class="matrix" id="channel-matrix">
      <!-- Populated by JS -->
    </div>
  </div>
</div>

<div class="fatal" id="fatal-error" style="display: none;"></div>

<script>
// RAW DATA - replace with actual LND/REST data
const DATA = {
  invoice: {
    r_hash: "27a4ac75f9cee8756b4b3c585633c279a6275a70db4394c2af4f55f46f15bb8a",
    payment_hash: "cb1d66043fee2742fa7e1c2532294db2ee6f5885314ff129d93cdeca12465b20",
    payment_request: "lnbcrt1m1p40t6yhpp5y7j2ca0eem58266t83v9vv7z0xnzwknsmdpefs40fa2lgmc4hw9qdqqcqzzsxqyz5vqsp59vt20d3sz089zyps0prj3ghnewhd5myd0mm0yvz835sn95cjrdts9qxpqysgqtl4w8460r5n3fadg4yr24avsnj5xx9zkm8u9lwx6en2c0qsuvpq3j24f8mnh4uvdluzeq9775as9cpl3r5hywkual45q0tfu63fqeggp27n2qm",
    amount: 100000,
    timestamp: Date.now(),
    status: "unpaid"
  },
  channels: [
    {
      chan_id: "b4b530675daec54ed9ca59cd2bff5bd552ed844bfd60b6fa52da004136f239c5",
      capacity: 1000000,
      local_balance: 496530,
      remote_balance: 500000,
      remote_pubkey: "0225a72a6bee672de3e8dd80fcac4d0827546b761c6dbe552527b88157ac9facd5",
      active: true,
      private: false,
      peer_online: false,
      local_initiator: true,
      push_amount: 500000,
      inbound_for: "Alice",
      outbound_for: "Bob",
      probe: { 
        success: true, 
        reason: "Route found via direct channel",
        fee_sat: 10,
        path: ["Bob", "Alice"]
      }
    },
    {
      chan_id: "e3d0e863a3fcd321d91a0204dcd8229e9d782030b8569d75f4ef6dc5104886ae",
      capacity: 1500000,
      local_balance: 500000,
      remote_balance: 996530,
      remote_pubkey: "03042a9655ba75aef3dbd9f67fcd67840c9c4c7444c1579dcb3569feefecb8719b",
      active: true,
      private: false,
      peer_online: true,
      local_initiator: false,
      push_amount: 0,
      inbound_for: "Bob",
      outbound_for: "Alice",
      probe: {
        success: false,
        reason: "Insufficient liquidity in direction Carol→Alice",
        error_code: "NO_ROUTE",
        capacity_available: false
      }
    },
    {
      chan_id: "cf32f959106b16ef2b5ef22a436abd8466766411ee0b9a9f2931d8362cf0a088",
      capacity: 500000,
      local_balance: 0,
      remote_balance: 496530,
      remote_pubkey: "03cc8aa6ac238af1ea519054a2c886659ede02cd6bde210d413d5c37c2f930aff9",
      active: true,
      private: false,
      peer_online: true,
      local_initiator: true,
      push_amount: 0,
      inbound_for: "Carol",
      outbound_for: "Alice",
      probe: {
        success: false,
        reason: "Zero outbound capacity",
        error_code: "INSUFFICIENT_CAPACITY"
      }
    }
  ],
  payment: null,
  evidence: {
    txid: null,
    block: null,
    height: null
  }
};

// DOM ELEMENTS
const els = {
  invId: document.getElementById('inv-id'),
  invAmount: document.getElementById('inv-amount'),
  invStatus: document.getElementById('inv-status'),
  chanTotal: document.getElementById('chan-total'),
  capacityOut: document.getElementById('capacity-out'),
  capacityIn: document.getElementById('capacity-in'),
  routesLive: document.getElementById('routes-live'),
  channelMatrix: document.getElementById('channel-matrix'),
  fatal: document.getElementById('fatal-error')
};

// RENDER CHANNEL MATRIX
function renderChannels() {
  const matrix = document.getElementById('channel-matrix');
  matrix.innerHTML = '';
  
  const channels = DATA.channels || [];
  
  channels.forEach((ch, i) => {
    const div = document.createElement('div');
    div.className = `channel ${ch.active ? 'live' : 'dead'}`;
    div.dataset.chan = ch.chan_id.slice(-6);
    
    let probeClass = '';
    let probeIcon = '✗';
    if (ch.probe?.success) {
      probeClass = 'pass';
      probeIcon = '✓';
    } else if (ch.probe?.error_code === 'INSUFFICIENT_CAPACITY' || ch.probe?.error_code === 'NO_ROUTE') {
      probeClass = 'fail';
    }
    
    div.innerHTML = `
      <span class="chan-id">#${ch.chan_id.slice(-6)}</span>
      <div class="chan-info">
        <div>${ch.remote_pubkey.slice(0,12)}... → ${ch.inbound_for}</div>
        <div style="font-size:11px; opacity:0.6;">push: ${ch.push_amount ? ch.push_amount + ' sats' : '0'} | ${ch.probe?.reason || 'idle'}</div>
      </div>
      <span class="chan-capacity">${ch.capacity.toLocaleString()} sats</span>
    `;
    
    div.addEventListener('click', () => showChannelDetails(ch));
    
    matrix.appendChild(div);
  });
  
  if (channels.length === 0) {
    matrix.innerHTML = '<div class="channel" style="justify-content:center; opacity:0.5;">NO CHANNELS DETECTED</div>';
  }
}

// CHANNEL DETAILS ON CLICK
function showChannelDetails(ch) {
  const step = document.createElement('div');
  step.className = 'step';
  step.innerHTML = `
    <div class="step-number">${ch.chan_id.slice(-4)}</div>
    <div class="step-content">
      <div><strong>CHAN_ID:</strong> ${ch.chan_id}</div>
      <div><strong>REMOTE PUBKEY:</strong> ${ch.remote_pubkey}</div>
      <div><strong>CAPACITY:</strong> ${ch.capacity.toLocaleString()} sats</div>
      <div><strong>LOCAL BALANCE:</strong> ${ch.local_balance.toLocaleString()} sats</div>
      <div><strong>REMOTE BALANCE:</strong> ${ch.remote_balance.toLocaleString()} sats</div>
      <div style="margin-top:8px;"><strong>PROBE RESULT:</strong></div>
      <pre>${JSON.stringify(ch.probe, null, 2)}</pre>
      <div style="margin-top:8px; text-transform:uppercase; letter-spacing:1px;">
        STATUS: <span class="${ch.probe?.success ? 'pass' : 'fail'}" style="color:${ch.probe?.success ? '#00ff00' : '#ff1a1a'};">${ch.probe?.success ? 'ROUTE OK' : 'ROUTE BLOCKED'}</span>
      </div>
    </div>
  `;
  
  document.querySelector('.terminal').appendChild(step);
}

// UPDATE STATUS
function updateStatus() {
  if (DATA.channels) {
    const outCap = DATA.channels.reduce((a, c) => a + (c.local_balance || 0), 0);
    const inCap = DATA.channels.reduce((a, c) => a + (c.remote_balance || 0), 0);
    const routes = DATA.channels.filter(c => c.probe?.success).length;
    
    els.capacityOut.textContent = (outCap).toLocaleString() + ' sats';
    els.capacityIn.textContent = (inCap).toLocaleString() + ' sats';
    els.capacityIn.style.color = inCap > 0 ? 'var(--acid)' : 'var(--warn)';
    els.routesLive.textContent = routes;
    els.routesLive.style.color = routes > 0 ? 'var(--acid)' : 'var(--error)';
  }
}

// FATAL ERROR HANDLER
function fatal(msg) {
  const el = els.fatal;
  el.textContent = 'FATAL: ' + msg;
  el.style.display = 'block';
}

// BOOT
try {
  renderChannels();
  updateStatus();
} catch (e) {
  fatal(e.message);
}

// REAL-TIME UPDATE LOOP (in production, use WebSocket/REST)
setInterval(() => {
  try {
    renderChannels();
    updateStatus();
  } catch (e) {
    fatal(e.message);
  }
}, 10000);

// KEYEBOARD: Press K to kill all routes, R to refresh
document.addEventListener('keydown', (e) => {
  if (e.key === 'k' || e.key === 'K') {
    // Kill all payment attempts
    DATA.channels.forEach(c => c.probe = { success: false, reason: 'Killed by operator', error_code: 'KILL' });
    renderChannels();
  }
  if (e.key === 'r' || e.key === 'R') {
    location.reload();
  }
});
</script>

</body>
</html>
