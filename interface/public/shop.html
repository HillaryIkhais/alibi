<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alibi — Seller Storefront</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0b; color: #e8e8ea; line-height: 1.6; }
  .container { max-width: 480px; margin: 0 auto; padding: 24px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .logo { width: 32px; height: 32px; background: linear-gradient(135deg, #f59e0b, #f97316); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; }
  h1 { font-size: 1rem; font-weight: 600; letter-spacing: -0.02em; }
  .product-card { background: #1a1a1e; border: 1px solid #2d2d34; border-radius: 16px; padding: 20px; margin-bottom: 16px; }
  .product-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 8px; }
  .product-desc { color: #a1a1aa; font-size: 0.85rem; margin-bottom: 12px; }
  .price { font-size: 1.25rem; font-weight: 700; color: #f59e0b; margin-bottom: 12px; }
  .buy-btn { width: 100%; padding: 14px; border-radius: 12px; font-weight: 600; font-size: 1rem; border: none; cursor: pointer; background: #f59e0b; color: #000; }
  .buy-btn:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">A</div>
    <h1>Alibi</h1>
  </header>

  <div id="loading" class="card">
    <h2>Loading products…</h2>
  </div>

  <div id="products" style="display:none;"></div>
</div>

<script>
const API_BASE = '';
async function loadProducts() {
  const res = await fetch(`${API_BASE}/api/public/products`);
  if (!res.ok) {
    document.getElementById('loading').innerHTML = '<h2>Failed to load products</h2>';
    return;
  }
  const data = await res.json();
  const container = document.getElementById('products');
  document.getElementById('loading').style.display = 'none';
  container.style.display = 'block';
  data.products.forEach(p => {
    const card = document.createElement('div');
    card.className = 'product-card';
    card.innerHTML = `
      <div class="product-title">${p.title}</div>
      <div class="product-desc">${p.description}</div>
      <div class="price">${p.price_sats} sats</div>
      <button class="buy-btn" onclick="location.href='/interface/public/checkout.html?id=${p.id}'">Buy now</button>
    `;
    container.appendChild(card);
  });
}
loadProducts();
</script>
</body>
</html>
